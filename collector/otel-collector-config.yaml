receivers:

  otlp:

    protocols:

      grpc:

        endpoint: 0.0.0.0:4317

      http:

        endpoint: 0.0.0.0:4318

processors:

  memory_limiter:

    check_interval: 1s

    limit_mib: 512

  batch:

exporters:

  debug:

    verbosity: detailed

  otlp/jaeger:

    endpoint: jaeger:4317

    tls:

      insecure: true

  kafka:

    brokers:

      - kafka:9092

    topic: traces

    encoding: otlp_proto

service:

  pipelines:

    traces:

      receivers:

        - otlp

      processors:

        - memory_limiter

        - batch

      exporters:

        - kafka

        - otlp/jaeger