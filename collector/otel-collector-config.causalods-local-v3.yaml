receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  batch: {}
  filter/scientific_metrics:
    error_mode: propagate
    metrics:
      metric:
        - 'name != "http.server.request.duration" and name != "http.client.request.duration" and name != "jvm.cpu.recent_utilization"'

exporters:
  kafka/traces_v3:
    brokers: [kafka:9092]
    topic: traces-v3
    encoding: otlp_proto
  kafka/logs_v1:
    brokers: [kafka:9092]
    topic: logs-v1
    encoding: otlp_proto
  kafka/metrics_v1:
    brokers: [kafka:9092]
    topic: metrics-v1
    encoding: otlp_proto

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka/traces_v3]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka/logs_v1]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/scientific_metrics, batch]
      exporters: [kafka/metrics_v1]
