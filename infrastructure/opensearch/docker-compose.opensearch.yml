services:

  opensearch-node:

    image: opensearchproject/opensearch:2.19.0

    container_name: causalods-opensearch


    environment:

      - discovery.type=single-node

      - bootstrap.memory_lock=true

      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m

      - DISABLE_SECURITY_PLUGIN=true


    ulimits:

      memlock:

        soft: -1

        hard: -1


    ports:

      - "9200:9200"

      - "9600:9600"