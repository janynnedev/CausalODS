apiVersion: 1

groups:
  - orgId: 1
    name: causalods-platform-v3-health
    folder: CausalODS v3
    interval: 1m
    rules:
      - uid: causalods-v3-service-down
        title: CausalODS service unavailable
        condition: C
        data:
          - refId: A
            datasourceUid: causalods-prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              editorMode: code
              expr: 'min(up{job=~"order-service|payment-service"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: Um serviço instrumentado deixou de responder ao scrape.
        labels:
          component: platform-v3
          severity: warning
