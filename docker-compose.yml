services:

  order-service:

    build:
      context: ./services/order-service

    container_name: order-service

    restart: unless-stopped

    ports:
      - "8081:8081"

    volumes:
      - ./otel-agent/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar  

    environment:

      SERVER_PORT: 8081

      PAYMENT_SERVICE_URL: http://payment-service:8082

      CAUSALODS_FAULT_MODE: ${CAUSALODS_ORDER_FAULT_MODE:-none}
      CAUSALODS_FAULT_RATE: ${CAUSALODS_ORDER_FAULT_RATE:-1.0}
      CAUSALODS_FAULT_DELAY_MS: ${CAUSALODS_ORDER_FAULT_DELAY_MS:-1500}
      CAUSALODS_FAULT_SEED: ${CAUSALODS_ORDER_FAULT_SEED:-42}

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar

      OTEL_SERVICE_NAME: order-service

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

      OTEL_TRACES_EXPORTER: otlp

      OTEL_METRICS_EXPORTER: none

      OTEL_LOGS_EXPORTER: none

      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development

    depends_on:
      - payment-service
      - otel-collector    

    networks:
      - observability

  payment-service:

    build:
      context: ./services/payment-service

    container_name: payment-service

    restart: unless-stopped

    ports:
      - "8082:8082"

    volumes:
      - ./otel-agent/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar  

    environment:

      SERVER_PORT: 8082
    
      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar

      OTEL_SERVICE_NAME: payment-service

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

      OTEL_TRACES_EXPORTER: otlp

      OTEL_METRICS_EXPORTER: none

      OTEL_LOGS_EXPORTER: none

      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development  

      CAUSALODS_FAULT_MODE: ${CAUSALODS_PAYMENT_FAULT_MODE:-none}
      CAUSALODS_FAULT_RATE: ${CAUSALODS_PAYMENT_FAULT_RATE:-1.0}
      CAUSALODS_FAULT_DELAY_MS: ${CAUSALODS_PAYMENT_FAULT_DELAY_MS:-1500}
      CAUSALODS_FAULT_SEED: ${CAUSALODS_PAYMENT_FAULT_SEED:-42}

    depends_on:
      - otel-collector

    networks:
      - observability

  otel-collector:

    image: otel/opentelemetry-collector-contrib:0.130.0

    container_name: otel-collector

    restart: unless-stopped

    command:
      - "--config=/etc/otelcol/config.yaml"

    volumes:
      - ./collector/otel-collector-config.yaml:/etc/otelcol/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"

    depends_on:
      - kafka

    networks:
      - observability

  jaeger:

    image: jaegertracing/all-in-one:1.66.0

    container_name: jaeger

    restart: unless-stopped

    ports:

      - "16686:16686"

      - "14250:14250"

    networks:
      - observability

  prometheus:

    image: prom/prometheus:v3.5.0

    container_name: prometheus

    restart: unless-stopped

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    ports:
      - "9090:9090"

    networks:
      - observability

  opensearch:

    image: opensearchproject/opensearch:2.19.0

    container_name: causalods-opensearch

    restart: unless-stopped

    environment:

      discovery.type: single-node

      bootstrap.memory_lock: "true"

      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"

      DISABLE_SECURITY_PLUGIN: "true"

    ulimits:

      memlock:

        soft: -1

        hard: -1

    ports:

      - "9200:9200"

      - "9600:9600"

    healthcheck:

      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]

      interval: 20s

      timeout: 10s

      retries: 20

      start_period: 30s

    networks:
      - observability

  kafka:

    image: confluentinc/cp-kafka:7.8.0

    container_name: kafka

    restart: unless-stopped

    hostname: kafka

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    networks:
      - observability

  correlation-engine:

    build:
      context: ./correlation-engine

    container_name: correlation-engine

    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy

    environment:

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      KAFKA_TOPIC: traces

      CONSUMER_GROUP: correlation-engine

      OPENSEARCH_HOST: causalods-opensearch

      OPENSEARCH_PORT: 9200

      MODEL_PATH: /app/training/models/xgboost_rca.pkl

      RCA_MODEL_VERSION: ${RCA_MODEL_VERSION:-v2}

      MODEL_PATH_V2: ${MODEL_PATH_V2:-training/models/xgboost_rca_v2.pkl}

      MODEL_MANIFEST_PATH_V2: ${MODEL_MANIFEST_PATH_V2:-training/models/xgboost_rca_v2.manifest.json}

    volumes:
      - ./correlation-engine/output:/app/output

    restart: unless-stopped

    networks:
      - observability

networks:
  observability: