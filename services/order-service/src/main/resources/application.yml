spring:

  application:
    name: order-service

server:
  port: ${SERVER_PORT:8081}

payment:

  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8082}

management:

  endpoints:

    web:

      exposure:

        include:

          - health
          - info
          - metrics
          - prometheus
          - env

  endpoint:

    health:

      show-details: always

  metrics:

    tags:

      application: order-service